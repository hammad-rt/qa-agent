<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>QA Agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--mute:#8a93a6;--acc:#5b9cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5b84b;--blk:#b38cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
*{box-sizing:border-box}aside{width:320px;flex:0 0 320px;min-width:0;overflow:hidden auto;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
h1{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
h2{font-size:15px;margin:0 0 8px}
.new{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.new .row{display:flex;gap:8px;min-width:0}.new .row>*{flex:1 1 0;min-width:0}.new .row select{flex:0 0 110px}
input,select,button,textarea{min-width:0;max-width:100%;font:inherit;color:var(--text);background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer;background:#1f2633}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.dan{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}
#runs{overflow:auto;flex:1}
.run{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}.run:hover,.run.sel{background:#1d2230}
.run .t{font-weight:600}.mute{color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin-right:4px;background:#252b38}
.PASS,.passed{background:#123d2c;color:var(--ok)}.FAIL,.failed{background:#40191b;color:var(--bad)}
.BLOCKED{background:#2e2142;color:var(--blk)}.running{background:#14304f;color:var(--acc)}.paused,.AGENT{background:#3b2f14;color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px}
.tab{padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}.tab.on{color:var(--text);border-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:16px;display:none}.pane.on{display:block}
.head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
pre.console{background:#0a0c10;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;max-height:42vh;overflow:auto;margin:0 0 8px;font:12px/1.4 ui-monospace,monospace}
.ask{display:flex;gap:6px;padding:8px;border:1px solid var(--warn);border-radius:8px;background:#211b0e;margin-bottom:12px}.ask input{flex:1}
.ev{border-left:2px solid var(--line);padding:4px 10px;margin-left:6px;font-size:13px}
.ev.step{border-color:var(--acc)}.ev.fin{border-color:var(--ok)}.ev.err{border-color:var(--bad)}
.ev .who{color:var(--mute);font-size:11px}code{background:#0c0e12;padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
.case{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--panel)}
.case ol{margin:6px 0 6px 18px;padding:0}.inf{color:var(--warn);font-size:11px}.chg{color:var(--bad);font-size:11px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.shots img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.empty{color:var(--mute);padding:40px;text-align:center}
#zoom{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}#zoom img{max-width:95vw;max-height:95vh}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;font-size:13px;vertical-align:top}
iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.blk{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--panel)}
.blk>summary{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.blk>summary::-webkit-details-marker{display:none}.blk .body{padding:4px 12px 12px}
.verdict{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;background:#10131a}
.verdict div{margin:2px 0}.say{color:#c9cfdb;font-size:13px;margin:6px 0;white-space:pre-wrap}
.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:10px}.toolbar label{color:var(--mute);font-size:12px}
.ev.read{opacity:.55}.hideReads .ev.read{display:none}
.kn h3{font-size:14px;margin:14px 0 6px;color:var(--accent,#7aa2ff)}.kn ul{margin:0 0 8px 18px;padding:0}.kn li{margin:3px 0}
.kn .new{color:#7ee2a8}.kn textarea{width:100%;min-height:420px;font-family:ui-monospace,monospace;font-size:12px}
.kn .bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.kn details{margin-top:14px}
.runbar{display:flex;align-items:center;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line)}
.racts{float:right;display:none}.run:hover .racts{display:inline}.sm{padding:2px 7px;font-size:12px}.lbl{font-size:12px;color:#c9b8ff;margin:2px 0}
.rsel{vertical-align:middle;margin:0 4px 0 0}.shotbox{position:relative}.shotbox .x{position:absolute;top:6px;right:6px;display:none}.shotbox:hover .x{display:block}
.mem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}.mem .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mem textarea{width:100%;min-height:70px}.mfil{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
</style></head><body>
<aside>
  <h1>QA Agent</h1>
  <div class="new">
    <div class="row" style="display:flex;gap:8px"><input id="task" style="flex:1" placeholder="Redmine task #"><select id="env"><option>staging</option><option>pre-prod</option><option>production</option></select></div>
    <input id="caseIds" placeholder="Cases (optional), e.g. TC1,TC2">
    <div class="row"><button class="pri" onclick="start(false)">Start run</button><button onclick="start(true)" title="Draft the plan and answer its questions without testing. The next Start run of the same task and environment continues from this plan.">Plan only</button></div>
    <div id="startErr" class="mute"></div>
  </div>
  <div id="runs"></div>
</aside>
<main>
  <div class="head"><div><h2 id="title">Pick a run or start one</h2><div id="sub" class="mute"></div></div>
    <div class="row" style="flex:0 0 auto"><button id="resumeBtn" onclick="resume()" style="display:none">Resume</button><span id="rerunBtns" style="display:none"><button onclick="rerun({})" title="Run every case again from the start, same plan">↻ Rerun all</button><button onclick="rerun({failed:true})" title="Run again only the cases that did not pass">↻ Rerun not passed</button><button onclick="fresh()" title="Plan this task again from scratch, then run">New plan</button></span><button id="stopBtn" class="dan" onclick="stopJob()" style="display:none">Stop</button></div></div>
  <div class="tabs"><div class="tab on" data-p="live">Live</div><div class="tab" data-p="cases">Cases</div><div class="tab" data-p="shots">Screenshots</div><div class="tab" data-p="log">Actions</div><div class="tab" data-p="report">Report</div><div class="tab" data-p="know">Knowledge</div><div class="tab" data-p="mem">Memory</div></div>
  <div id="live" class="pane on">
    <div id="askBox"></div>
    <div id="consoleWrap" style="display:none"><div class="mute">Agent console</div><pre class="console" id="console"></pre></div>
    <div class="toolbar"><b>Steps</b><label><input type="checkbox" id="showReads" onchange="$('#events').classList.toggle('hideReads',!this.checked)"> show page reads</label><label><input type="checkbox" id="follow" checked> follow live</label></div><div id="events" class="hideReads"><div class="empty">No steps yet.</div></div>
  </div>
  <div id="cases" class="pane"></div><div id="know" class="pane"></div><div id="mem" class="pane"></div>
  <div id="shots" class="pane"></div>
  <div id="log" class="pane"></div>
  <div id="report" class="pane"></div>
</main>
<div id="zoom" onclick="this.style.display='none'"><img></div>
<script>
function nearBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<40}
function setHTML(el,html){if(typeof el=='string')el=$(el);if(!el||el._h===html)return;
 if(el.contains(document.activeElement)&&document.activeElement!==document.body&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!/checkbox|radio|button/.test(document.activeElement.type))return;
 const open=[...el.querySelectorAll('details[open]')].map(d=>d.dataset.k||d.querySelector('summary')?.textContent);
 const st=el.scrollTop,ws=window.scrollY;el.innerHTML=html;el._h=html;
 el.querySelectorAll('details').forEach(d=>{if(open.includes(d.dataset.k||d.querySelector('summary')?.textContent))d.open=true});
 el.scrollTop=st;if(window.scrollY!==ws)window.scrollTo(0,ws)}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null, job=null, traceNext=0, outLen=0, lastDetail=null;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#'+t.dataset.p).classList.add('on')});
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function pills(c){return Object.entries(c||{}).map(([k,v])=>`<span class="pill ${k.split(' ')[0]}">${v} ${esc(k)}</span>`).join('')}
let sel=new Set();
async function loadRuns(){try{const rs=await api('/api/runs');const ids=new Set(rs.map(r=>r.id));sel=new Set([...sel].filter(x=>ids.has(x)));
 const bar=`<div class="runbar"><label class="mute"><input type="checkbox" ${rs.length&&sel.size==rs.length?'checked':''} onchange="selAll(this.checked)"> select all</label><span style="flex:1"></span>${sel.size?`<button class="dan sm" onclick="delSel()">Delete ${sel.size}</button>`:''}</div>`;
 window._runs=rs;
 setHTML('#runs',(rs.length?bar:'')+rs.map(r=>`<div class="run ${r.id==cur?'sel':''}" onclick="openRun('${r.id}')"><div class="t"><input type="checkbox" class="rsel" ${sel.has(r.id)?'checked':''} onclick="event.stopPropagation();togSel('${r.id}',this.checked)"> #${esc(r.task)} <span class="pill ${r.status}">${esc(r.status)}</span><span class="racts"><button class="sm" title="Rename" onclick="event.stopPropagation();renameRun('${r.id}')">✎</button><button class="sm dan" title="Delete" onclick="event.stopPropagation();delRun('${r.id}')">✕</button></span></div>${r.label?`<div class="lbl">${esc(r.label)}</div>`:''}<div class="mute">${esc(r.env||'')} · ${r.done}/${r.cases} cases · ${esc((r.started||'').replace('T',' '))}</div><div>${pills(r.counts)}</div></div>`).join('')||'<div class="empty">No runs yet.</div>')}catch(e){}}
function openRun(id){if(cur!==id){cur=id;traceNext=0;blocks=[];openBlock=null;$('#events').innerHTML='';}loadRuns();refresh()}
async function start(dry){$('#startErr').textContent='';try{job=await api('/api/start',{task:$('#task').value,env:$('#env').value,cases:$("#caseIds").value,dry_run:dry});outLen=0;$('#console').textContent='';cur=null;$('#events').innerHTML='';$('#title').textContent='Starting #'+$('#task').value+'…';pollJob()}catch(e){$('#startErr').textContent=e.message}}
async function rerun(o){if(!cur)return;if(job&&job.running){alert('A run is still going; stop it or wait for it to finish.');return}
 const what=o.cases?'case '+o.cases:o.failed?'the cases that did not pass':'all cases';if(!confirm('Rerun '+what+' from the start with this plan?'))return;
 try{job=await api('/api/start',{rerun:cur,...o});outLen=0;$('#console').textContent='';cur=null;$('#events').innerHTML='';$('#title').textContent='Rerunning…';pollJob()}catch(e){alert(e.message||e)}}
async function fresh(){if(!cur)return;if(job&&job.running){alert('A run is still going; stop it or wait for it to finish.');return}
 if(!confirm('Plan this task again from scratch and run it?'))return;
 try{job=await api('/api/start',{fresh:cur});outLen=0;$('#console').textContent='';cur=null;$('#events').innerHTML='';$('#title').textContent='Planning again…';pollJob()}catch(e){alert(e.message||e)}}
async function resume(){try{job=await api('/api/start',{resume:cur});outLen=0;$('#console').textContent='';pollJob()}catch(e){alert(e.message)}}
async function stopJob(){if(job&&confirm('Stop this run? It pauses and can be resumed.'))job=await api(`/api/jobs/${job.id}/stop`,{})}
async function answer(){const i=$('#ans');await api(`/api/jobs/${job.id}/input`,{text:i.value});$('#askBox').innerHTML='';$('#askBox').dataset.p=''}
async function pollJob(){if(!job)return;try{const j=await api(`/api/jobs/${job.id}/out?since=${outLen}`);outLen=j.len;job=j;$('#consoleWrap').style.display='';const c=$('#console');const stick=nearBottom(c);c.textContent+=j.out;if(stick)c.scrollTop=c.scrollHeight;
 if(j.run_dir&&cur!==j.run_dir){cur=j.run_dir;traceNext=0;$('#events').innerHTML='';loadRuns()}
 if(j.waiting){if(!$('#ans')||$('#askBox').dataset.p!==j.prompt)$('#askBox').dataset.p=j.prompt,$('#askBox').innerHTML=`<div class="ask"><span style="flex:0 1 50%;white-space:pre-wrap">${esc(j.prompt)}</span><input id="ans" type="${j.secret?'password':'text'}" autocomplete="off" placeholder="Type an answer, or leave empty for the default" onkeydown="if(event.key=='Enter')answer()"><button class="pri" onclick="answer()">Send</button></div>`,(document.activeElement===document.body)&&$('#ans').focus({preventScroll:true})}else $('#askBox').innerHTML='';
 $('#stopBtn').style.display=j.running?'':'none';if(!j.running){$('#askBox').innerHTML='';loadRuns()}}catch(e){}}
const clean=t=>String(t??'').replace(/<\|[^|]*\|>/g,' ').replace(/^\s*(thought|analysis|final)\b\s*/i,'').replace(/\s+\n/g,'\n').trim();
function tryJson(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}
function name(a){return esc(a.element||a.name||'a field')}
function callHtml(c,who){const a=c.args||{};let cls='',txt;
  switch(c.name){
  case 'mark_step':cls='step';txt=`✔ <b>Step ${esc(a.n)}</b>${a.deviation?': '+esc(a.deviation):''}`;break;
  case 'finish':cls='fin';txt=`<b>${a.stuck?'Stopped (stuck)':'Finished'}</b>: ${esc(clean(a.notes))}`;break;
  case 'record_value':txt=`Read <b>${esc(a.name)}</b> = <code>${esc(a.value)}</code>`;break;
  case 'browser_navigate':txt=`Open <code>${esc(a.url)}</code>`;break;
  case 'browser_click':txt=`Click <b>${name(a)}</b>`;break;
  case 'browser_type':txt=`Type <code>${esc(a.text)}</code> into <b>${name(a)}</b>`;break;
  case 'browser_press_key':txt=`Press <code>${esc(a.key)}</code>`;break;
  case 'browser_fill_form':txt=`Fill ${(a.fields||[]).map(f=>`<b>${esc(f.name||f.element)}</b> = <code>${esc(f.value)}</code>`).join(', ')}`;break;
  case 'browser_select_option':txt=`Choose <code>${esc((a.values||[]).join(', '))}</code> in <b>${name(a)}</b>`;break;
  case 'browser_snapshot':case 'browser_find':cls='read';txt=c.name=='browser_find'?`Look for “${esc(a.text)}”`:'Read the page';break;
  case 'browser_take_screenshot':txt='📷 Screenshot';break;
  case 'browser_wait_for':cls='read';txt='Wait';break;
  case 'run_helper':{let p={};try{p=JSON.parse(a.params_json||'{}')}catch(e){};txt=a.name=='login_form'?`Log in as <b>${esc(p.account||'')}</b>`:`Run helper <code>${esc(a.name)}</code>`;break}
  case 'needs_manual_login':cls='err';txt=`Needs a person to log in: ${esc(a.reason)}`;break;
  case 'propose_memory':txt=`💡 Learned: ${esc(a.text||a.fact||JSON.stringify(a))}`;break;
  default:txt=`<code>${esc(c.name)}</code> <span class="mute">${esc(JSON.stringify(a).slice(0,140))}</span>`}
  return `<div class="ev ${cls}">${who}<br>${txt}</div>`}
function verdictHtml(v){return `<div class="verdict"><div><span class="pill ${String(v.verdict||'').split(' ')[0]}">${esc(v.verdict)}</span> <b>Judge</b>${v.severity?` · severity ${esc(v.severity)}`:''}</div>
 ${v.expected?`<div><b>Expected:</b> ${esc(v.expected)}</div>`:''}${v.actual?`<div><b>Actual:</b> ${esc(v.actual)}</div>`:''}${v.note?`<div class="mute">${esc(v.note)}</div>`:''}${v.bug_title?`<div><b>Bug:</b> ${esc(v.bug_title)}</div>`:''}</div>`}
let blocks=[], openBlock=null;
function caseTitle(id){const c=((lastPlan||{}).cases||[]).find(x=>x.id==id);return c?c.title:''}
let lastPlan=null;
function addEvent(e){const who=`<span class="who">${esc((e.at||'').slice(11,19))} · ${esc((e.author||'').replace('tester_',''))}</span>`;
  const a=e.author||'';
  if(a=='planner'||a=='reviewer'){ensure('plan','Planning');openBlock.html+=a=='reviewer'?`<div class="ev">${who}<br>Plan review: ${esc((tryJson(e.text)||{}).ok===false?'changes requested':'ok')}</div>`:`<div class="ev">${who}<br>Drafted the plan</div>`;return}
  if(a=='judge'){const v=tryJson(e.text)||{};if(v.case_id){if(!openBlock||openBlock.id!=v.case_id)ensure(v.case_id);openBlock.verdict=v.verdict}openBlock&&(openBlock.html+=verdictHtml(v));openBlock&&(openBlock.closed=true);return}
  if(!openBlock||openBlock.closed||openBlock.id=='plan'){ensure(nextCaseId())}
  if(e.calls)openBlock.html+=e.calls.map(c=>callHtml(c,who)).join('');
  else if(e.text){const t=clean(e.text);if(t)openBlock.html+=`<div class="say">${esc(t.length>700?t.slice(0,700)+'…':t)}</div>`}}
let picked=null;
function nextCaseId(){const done=new Set(blocks.map(b=>b.id));const c=((lastPlan||{}).cases||[]).find(x=>!done.has(x.id)&&(!picked||picked.includes(x.id)));return c?c.id:'case '+(blocks.length)}
function ensure(id,title){if(openBlock&&openBlock.id==id&&!openBlock.closed)return;let b=blocks.find(x=>x.id==id&&!x.closed);if(!b){b={id,title:title||caseTitle(id),html:'',verdict:null,closed:false};blocks.push(b)}openBlock=b}
function drawBlocks(){const box=$('#events');const open=new Set([...box.querySelectorAll('details[open]')].map(d=>d.dataset.id));
  setHTML(box,blocks.map((b,i)=>{const isLast=i==blocks.length-1;const o=open.has(b.id)||isLast;
   return `<details class="blk" data-id="${esc(b.id)}" ${o?'open':''}><summary><b>${esc(b.id)}</b> <span>${esc(b.title)}</span> ${b.verdict?`<span class="pill ${b.verdict.split(' ')[0]}">${esc(b.verdict)}</span>`:(isLast&&!b.closed?'<span class="pill running">in progress</span>':'')}</summary><div class="body">${b.html}</div></details>`}).join('')||'<div class="empty">No steps yet.</div>');
  {const p=$('#live');if($('#follow').checked&&p._stick!==false)p.scrollTop=p.scrollHeight}}
async function refresh(){if(!cur)return;let d;
 try{d=await api(`/api/runs/${cur}`)}catch(e){return}
 lastPlan=d.plan;picked=(d.mode||{}).cases||null;
 try{const s=d.summary;setHTML('#title',`#${esc(s.task)} on ${esc(s.env||'')} <span class="pill ${s.status}">${esc(s.status)}</span>`);
  setHTML('#sub',`${s.done}/${s.cases} cases ${pills(s.counts)} · ${esc(s.last||'')}`);$('#resumeBtn').style.display=(s.status=='paused'&&!(job&&job.running))?'':'none';$('#rerunBtns').style.display=(s.status!='running'&&!(job&&job.running))?'':'none'}catch(e){console.error(e)}
 const key=JSON.stringify(d);if(key!==lastDetail){lastDetail=key;try{render(d)}catch(e){console.error('render',e)}}
 try{const t=await api(`/api/runs/${cur}/trace?since=${traceNext}`);if(!traceNext){blocks=[];openBlock=null}
  if(t.lines.length){for(const ln of t.lines){try{addEvent(ln)}catch(e){console.error('event',e,ln)}}traceNext=t.next;drawBlocks()}}catch(e){console.error('trace',e)}}
function render(d){const res=d.results||{};d.shots=d.shots||[];d.reports=d.reports||[];d.action_log=d.action_log||[];
 setHTML('#cases',((d.plan||{}).cases||[]).map(c=>{const r=res[c.id]||{};return `<div class="case"><h2>${esc(c.id)} · ${esc(c.title)} ${r.verdict?`<span class="pill ${r.verdict.split(' ')[0]}">${esc(r.verdict)}</span>`:'<span class="pill">pending</span>'} <button class="sm" style="float:right" onclick="rerun({cases:'${esc(c.id)}'})" title="Rerun only this case with the same plan">↻ Rerun</button></h2>
 <ol>${(c.steps||[]).map(st=>typeof st=='string'?`<li>${esc(st)}</li>`:`<li>[${esc(st.app)}] ${esc(st.text)} ${st.inferred?'<span class="inf">inferred</span>':''} ${st.changes_data?'<span class="chg">changes data</span>':''}</li>`).join('')}</ol>
 <div><b>Expected:</b> ${esc(c.expected)}</div>${r.actual?`<div><b>Actual:</b> ${esc(r.actual)}</div>`:''}${r.note?`<div><b>Notes:</b> ${esc(r.note)}</div>`:''}
 ${r.values&&Object.keys(r.values).length?`<div><b>Values:</b> ${Object.entries(r.values).map(([k,v])=>`${esc(k)}=<code>${esc(typeof v=='object'?v.value??JSON.stringify(v):v)}</code>`).join(' ')}</div>`:''}</div>`}).join('')||'<div class="empty">No plan yet.</div>');
 setHTML('#shots',d.shots.length?`<div class="shots">${d.shots.slice().reverse().map(n=>`<div class="shotbox"><img loading="lazy" src="/api/runs/${cur}/file?path=shots/${encodeURIComponent(n)}" onclick="zoom(this.src)"><button class="x sm dan" title="Delete screenshot" onclick="delShot('${esc(n)}')">✕</button><div class="mute">${esc(n)}</div></div>`).join('')}</div>`:'<div class="empty">No screenshots yet.</div>');
 setHTML('#log',(d.action_log||[]).length?`<table><tr><th>#</th><th>Case</th><th>App</th><th>Action</th><th>Step</th><th>Approval</th><th>Outcome</th></tr>${d.action_log.slice().reverse().map(a=>`<tr><td>${a.seq}</td><td>${esc(a.case_id)}</td><td>${esc(a.app)}</td><td><code>${esc(a.tool)}</code> ${a.inferred?'<span class="inf">inferred</span>':''}<div class="mute">${esc(JSON.stringify(a.args||{}).slice(0,140))}</div></td><td>${esc(a.plan_step??'')}</td><td>${esc(a.approval)}</td><td>${esc(a.outcome)}${a.deviation?`<div class="mute">${esc(a.deviation)}</div>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No actions yet.</div>');
 const rep=d.reports.find(n=>n=='report.html');
 setHTML('#report',(d.reports.length?`<div class="row" style="margin-bottom:10px;flex-wrap:wrap">${d.reports.map(n=>`<a href="/api/runs/${cur}/file?path=${encodeURIComponent(n)}" target="_blank"><button>${esc(n)}</button></a>`).join('')}</div>`:'')+(rep?`<iframe src="/api/runs/${cur}/file?path=report.html"></iframe>`:'<div class="empty">The report appears here when the run finishes.</div>'))}
function zoom(src){$('#zoom img').src=src;$('#zoom').style.display='flex'}
(async()=>{const js=await api('/api/jobs');job=js.find(j=>j.running)||null;if(job)pollJob();loadRuns()})();
$('#live').addEventListener('scroll',e=>e.target._stick=nearBottom(e.target));setInterval(pollJob,1000);setInterval(refresh,2000);setInterval(loadRuns,5000);

let know=[],knowEdit=null;
async function loadKnow(){try{know=await api('/api/knowledge')}catch(e){$('#know').innerHTML='<div class="mute">Could not load: '+esc(e.message||e)+'</div>';return}drawKnow()}
function drawKnow(){const today=new Date().toISOString().slice(0,10);
 $('#know').innerHTML=know.map((k,i)=>{
  const head=`<div class="bar"><h2 style="margin:0">${esc(k.pack)}</h2><span class="mute">${k.updated?'updated '+new Date(k.updated*1000).toLocaleString():'nothing learned yet'}</span>
   <span style="flex:1"></span>${knowEdit===i?`<button class="pri" onclick="saveKnow(${i})">Save</button><button onclick="knowEdit=null;drawKnow()">Cancel</button>`:`<button onclick="knowEdit=${i};drawKnow()">Edit</button>`}</div>`;
  if(knowEdit===i)return `<div class="kn">${head}<textarea id="knowText">${esc(k.learned)}</textarea></div>`;
  const secs=[];let cur=null;for(const ln of (k.learned||'').split('\n')){if(ln.startsWith('## ')){cur={h:ln.slice(3),items:[]};secs.push(cur)}else if(cur&&ln.startsWith('- '))cur.items.push(ln.slice(2))}
  const body=secs.length?secs.map(s=>{const [area,app]=[s.h.slice(0,s.h.lastIndexOf(':')),s.h.slice(s.h.lastIndexOf(':')+1)];
    return `<h3>${esc(area.replace(/_/g,' '))} <span class="mute">on ${esc(app)}</span></h3><ul>${s.items.map(t=>`<li class="${t.includes(today)?'new':''}">${esc(t)}</li>`).join('')}</ul>`}).join(''):'<div class="mute">Nothing learned yet. Routes and discovery notes appear here after a run.</div>';
  return `<div class="kn">${head}${body}<details><summary class="mute">Hand-written facts (facts.md, read-only)</summary><pre style="white-space:pre-wrap">${esc(k.facts)}</pre></details></div>`}).join('<hr>')||'<div class="mute">No packs found.</div>'}
async function saveKnow(i){try{await api('/api/knowledge',{pack:know[i].pack,learned:$('#knowText').value});knowEdit=null;await loadKnow()}catch(e){alert('Save failed: '+(e.message||e))}}
document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.p==='know')t.addEventListener('click',loadKnow)});
function togSel(id,on){on?sel.add(id):sel.delete(id);loadRuns()}
function selAll(on){sel=on?new Set((window._runs||[]).map(r=>r.id)):new Set();loadRuns()}
async function delSel(){if(!confirm(`Delete ${sel.size} run(s) with their screenshots and reports? This can't be undone.`))return;
 try{const r=await api('/api/runs/delete_many',{ids:[...sel]});if(r.skipped.length)alert('Skipped (still running): '+r.skipped.join(', '));if(r.deleted.includes(cur))cur=null;sel.clear();loadRuns()}catch(e){alert(e.message||e)}}
async function delRun(id){if(!confirm(`Delete run ${id} with its screenshots and reports? This can't be undone.`))return;
 try{await api(`/api/runs/${id}/delete`,{});if(cur==id){cur=null;location.hash='';location.reload()}else loadRuns()}catch(e){alert(e.message||e)}}
async function renameRun(id){const r=(window._runs||[]).find(x=>x.id==id)||{};const v=prompt('Label for this run (blank to clear):',r.label||'');if(v===null)return;
 try{await api(`/api/runs/${id}/label`,{label:v});loadRuns()}catch(e){alert(e.message||e)}}
async function delShot(n){if(!confirm('Delete screenshot '+n+'?'))return;try{await api(`/api/runs/${cur}/delete_shot`,{name:n});lastDetail=null;refresh()}catch(e){alert(e.message||e)}}
let mems=[],memEdit=null,memFilter='all';
async function loadMem(){try{mems=await api('/api/memory')}catch(e){$('#mem').innerHTML='<div class="mute">Could not load memory: '+esc(e.message||e)+'</div>';return}drawMem()}
function drawMem(){const st=['all','proposed','active','needs_recheck','retired'];
 const list=mems.filter(m=>memFilter=='all'||m.status==memFilter);
 $('#mem').innerHTML=`<div class="mfil">${st.map(s=>`<button class="sm ${memFilter==s?'pri':''}" onclick="memFilter='${s}';drawMem()">${s.replace('_',' ')} (${s=='all'?mems.length:mems.filter(m=>m.status==s).length})</button>`).join('')}</div>`+
 (list.map(m=>`<div class="mem"><div><span class="pill">${esc(m.kind)}</span> <span class="pill ${m.status=='active'?'PASS':m.status=='proposed'?'running':m.status=='retired'?'':'FAIL'}">${esc(m.status)}</span> <span class="mute">#${m.id}${m.area?' · '+esc(m.area):''} · ${esc(m.scope)} · used ok ${m.success_count}, failed ${m.failure_count}</span></div>
  ${memEdit===m.id?`<textarea id="memText">${esc(m.text)}</textarea>`:`<div style="margin-top:4px">${esc(m.text)}</div>`}
  <div class="acts">${memEdit===m.id?`<button class="sm pri" onclick="memDo(${m.id},'edit')">Save</button><button class="sm" onclick="memEdit=null;drawMem()">Cancel</button>`:
   `${m.status=='proposed'?`<button class="sm pri" onclick="memDo(${m.id},'approve')">Approve</button><button class="sm" onclick="memDo(${m.id},'reject')">Reject</button>`:''}
    ${m.status=='active'||m.status=='needs_recheck'?`<button class="sm" onclick="memDo(${m.id},'retire')">Retire</button>`:''}
    ${m.status=='retired'?`<button class="sm" onclick="memDo(${m.id},'restore')">Restore</button>`:''}
    <button class="sm" onclick="memEdit=${m.id};drawMem()">Edit</button><button class="sm dan" onclick="memDo(${m.id},'delete')">Delete</button>`}</div></div>`).join('')||'<div class="empty">Nothing here.</div>')}
async function memDo(id,a){if(a=='delete'&&!confirm('Delete memory #'+id+' for good?'))return;
 try{await api(`/api/memory/${id}/${a}`,a=='edit'?{text:$('#memText').value}:{});memEdit=null;await loadMem()}catch(e){alert(e.message||e)}}
document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.p==='mem')t.addEventListener('click',loadMem)});
setTimeout(()=>{const m=location.hash.match(/run=([\w-]+)/);if(m)openRun(m[1]);const t=location.hash.match(/tab=(\w+)/);if(t){const b=[...document.querySelectorAll('.tab')].find(x=>x.dataset.p==t[1]);if(b)b.click()}},300);
</script></body></html>
