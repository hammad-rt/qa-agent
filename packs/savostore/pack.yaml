# Savostore project pack. No secrets here: passwords are referenced by env var name only.
slug: savostore
name: Savostore
redmine:
  project_ids: [1567]
  test_case_subject_prefix: "Test Cases - "
  wiki_project: null            # null = same project as the issue
  wiki_pages: [Staging_Cardentials]

# Ask which portal/CRM user to use at the start of every run (Enter keeps the last one used).
# The usernames below are only the first suggestion on staging. Set false to always use them.
ask_accounts_each_run: true
# Environments: staging, preprod, prod, local. Missing pre-prod URLs are asked once and saved with their source.
# local = your own laptop's copy (CRM in /var/www/html/savostorea, portal = `npm run dev` in /var/www/html/savostore).

apps:
  portal:
    label: Customer portal
    envs:
      staging: https://staging5.rolustech.com:4225/
      preprod: https://westeros.rolustech.com:44310/   # Redmine wiki Pre_Prod_Cardentials
      prod: https://app.savostore.com/
      local: http://localhost:3000/          # Next.js dev server of /var/www/html/savostore
    accounts:
      customer:
        username: sidney@savostore.com
        password_env: SAVO_STAGING_PORTAL_PASSWORD
  crm:
    label: CRM (SuiteCRM)
    envs:
      staging: https://staging5.rolustech.com:4220/
      preprod: https://staging5.rolustech.com:44360/   # Redmine wiki Pre_Prod_Cardentials
      prod: https://savo.store/
      local: http://localhost/savostorea/    # SuiteCRM in /var/www/html/savostorea (portal's SUITECRM_INSTANCE_URL)
    accounts:
      admin:
        username: admin              # staging Administrator; maria.tariq is not an admin and cannot do data prep
        password_env: SAVOSTORE_CRM_PASSWORD__ADMIN
        role_markers: ["Admin"]      # text that must be visible after login for the admin role
    settle_seconds: 10               # subpanels and wallet totals load ~8 s late

# Apps whose login shows a CAPTCHA: a person logs in once in a visible browser before the cases run.
manual_login_apps: [portal]

# Known sites: pack URLs on these hosts don't need confirming at the plan gate. The browser itself is limited
# to the sites of each run's URLs, and asks before using any other site (e.g. a payment page).
allowlist:
  staging: [staging5.rolustech.com, checkout.stripe.com]
  preprod: [westeros.rolustech.com, staging5.rolustech.com, checkout.stripe.com]
  prod: [app.savostore.com, savo.store]
  local: [localhost, checkout.stripe.com]

# Envs where a case that explicitly asks for Quick Repair / execute SQL may run it
# (discovery never runs these; preprod/prod refused unless listed here).
admin_repair_envs: [staging, local]

# Action types the user may pre-approve for a whole run at the plan gate.
# change_settings is staging/preprod only (Policy.can_preapprove blocks it on prod).
preapprovable_actions:
  - pay_staging_test_card
  - move_order_status
  - create_test_order
  - add_parcel
  - change_settings
  - execute_repair_sql      # Quick Repair SQL that only adds new columns/tables/indexes (staging/local)

# Never pre-approvable: always a one-off approval.
always_ask_actions:
  - redmine_post
  - send_email
  - prod_write
  - repair_sql_destructive  # Quick Repair SQL that drops, changes or rewrites anything

risky_patterns:
  - "(?i)\\bpay( now)?\\b"
  - "(?i)\\bplace order\\b"
  - "(?i)\\bsubmit\\b"
  - "(?i)\\bconfirm\\b"
  - "(?i)\\bdelete\\b"
  - "(?i)checkout\\.stripe\\.com"

memory_areas: [rewards, protection, parcels, orders, payments, ui]

# Synonym groups for matching ## Routes screen names to discovery checklist items.
# Core only expands these tokens/phrases — product labels stay in the pack.
route_synonyms:
  - ["client wallet", "open wallet", "wallet", "rewards"]
  - ["order payments subpanel", "order payments", "record payment", "payment", "payments"]
  - ["receive package", "parcel", "package"]

# Helpers (phase 6). Core helpers login_form and read_table need no setup. Project helpers stay disabled
# until their path and labels are confirmed on the real UI (fill these from a live run, never guessed).
helpers:
  login_form: {}                  # optional: path, user_label, password_label, submit_label
  read_wallet:
    path: null                    # portal page that shows the rewards wallet
    labels: []                    # e.g. the exact labels next to the Current / Total / Used amounts
  portal_apply_rewards: {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  portal_create_order:  {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  crm_move_order_status: {path: null, selects: {}, submit_label: null, success_text: null, read_labels: []}
  crm_add_parcel:       {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  crm_ship_parcel:      {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}

# Placeholder tokens used in suite cases. Resolved up front (find, else create); values live in run state only.
# Create is a sequence of app-tagged parts: customer places the order on the portal; CRM does parcel/status/invoice.
placeholders:
  token_pattern: '(?i)\b(?:ORDER-[A-Z][A-Z0-9_-]*|CUSTOMER|Wallet)\b'
  items:
    - placeholder: CUSTOMER
      description: >-
        The run's portal login, and the CRM contact with that email. Conditions: Savo Rewards enabled (E1, E2).
      value: customer_email
      mutating: false
      area: rewards
      app: crm
      client_login_app: portal
      find_app: crm
      find: >-
        Confirm the CRM contact for {client} exists and Savo Rewards is enabled on that contact. Record the
        contact's login/email as the value (not a fixed person name).
      create: []
      aliases: []
    - placeholder: ORDER-EARN
      description: >-
        USD Shipping Only order of CUSTOMER; shipping invoiced (S_e e.g. about $1,000), unpaid (no Paid payment,
        balance = total), no rewards redeemed, status not Order Delivered. Used by E1 (consumes it).
      value: order_earn
      aliases: [test_order]
      mutating: true
      area: rewards
      app: crm
      find_app: crm
      client_login_app: portal
      record_hint: the CRM record id from the page URL, the record=... part
      find: >-
        In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
        that is USD, status "Invoiced & Shipped", shipping invoiced, unpaid (balance = total, no Paid payment),
        no rewards redeemed, status not Order Delivered. Give the number with its letter prefix exactly as shown.
      create:
        - app: portal
          text: >-
            As the portal test client, create a new USD Shipping Only order (one package). Put "QA-AGENT TEST" in
            the description/notes if there is a field for it. Do not pay on the portal in this prep step. Record
            the new order number when shown.
        - app: crm
          text: >-
            For that new shipping-only order of {client}: set its parcel to Received, then move status one step at
            a time (save each): Shipped to Warehouse > On Warehouse floor > Ready to Ship > Shipped >
            Invoiced & Shipped ("Shipped" alone does not create the invoice). Invoice the shipping in the CRM.
            Do not pay and do not apply rewards. Record the order number and CRM record id.
      verify:
        app: portal
        text: >-
          browser_navigate to <portal URL>/shipping-only/invoice/{record}. Usable if balance > 0 and Pay By Card
          is shown. Do not pay. This case fills the wallet, so a Savo Rewards box that says "no Savo Rewards" is fine.
      consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242", "earn"]
    - placeholder: ORDER-MULTI
      description: >-
        USD Shipping Only order of CUSTOMER with exactly 1 package; shipping invoiced (S_m e.g. about $1,000),
        unpaid, no rewards redeemed/applied. Later cases (A2, A9) add a second package (~$400) in the CRM.
        Used by B1-B7, B9, B12, B15, B16-3, A1-A4, A7, A9-A14. B5 pays it, so unpaid-needing cases run before B5.
      value: order_multi
      aliases: [test_order]
      mutating: true
      area: rewards
      app: crm
      find_app: crm
      client_login_app: portal
      record_hint: the CRM record id from the page URL, the record=... part
      find: >-
        In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
        that is USD, status "Invoiced & Shipped", exactly one package, shipping invoiced (~$1,000), unpaid,
        no rewards redeemed/applied. Give the number with its letter prefix exactly as shown.
      create:
        - app: portal
          text: >-
            As the portal test client, create a new USD Shipping Only order with exactly one package. Put
            "QA-AGENT TEST" in the description/notes if there is a field for it. Do not pay. Record the new order number.
        - app: crm
          text: >-
            For that new shipping-only order of {client}: set its parcel to Received, then move status one step at
            a time (save each): Shipped to Warehouse > On Warehouse floor > Ready to Ship > Shipped >
            Invoiced & Shipped. Invoice the shipping in the CRM. Leave exactly one package. Do not pay and do not
            apply rewards. Record the order number and CRM record id.
      verify:
        app: portal
        text: >-
          browser_navigate to <portal URL>/shipping-only/invoice/{record}. Usable if balance > 0 and Pay By Card
          is shown.{condition}
        condition:
          when: ["\\breward", "\\bredeem", "use up to", "wallet"]
          unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
          then: >-
            {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
            says "no Savo Rewards".
          else: >-
            {space}A Savo Rewards box that says "no Savo Rewards" is fine for this case. Do not apply rewards.
        keep_record_if:
          reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
          only_when_condition: true
          note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
      consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
    - placeholder: ORDER-KES
      description: >-
        KES Shipping Only order of CUSTOMER; shipping invoiced (S_k), some non-shipping charges N_k
        (protection, next-day delivery or misc), unpaid, no rewards redeemed.
      value: order_kes
      aliases: [test_order]
      mutating: true
      area: rewards
      app: crm
      find_app: crm
      client_login_app: portal
      record_hint: the CRM record id from the page URL, the record=... part
      find: >-
        In the CRM, open Invoices (AOS_Invoices) and find a KES shipping-only order for {client} at
        "Invoiced & Shipped", shipping invoiced, with some non-shipping charges, unpaid, no rewards redeemed.
      create:
        - app: portal
          text: >-
            As the portal test client, create a new KES (Kenyan Shillings) Shipping Only order. Put "QA-AGENT TEST"
            in the description/notes if possible. Do not pay.
        - app: crm
          text: >-
            For that KES shipping-only order of {client}: set parcel to Received; move status step by step to
            Invoiced & Shipped; invoice shipping; ensure some non-shipping charges exist (protection, next-day or
            misc). Do not pay and do not apply rewards.
      verify:
        app: portal
        text: >-
          Open the portal invoice for {record}. Usable if balance > 0 in KES and Pay By Card is shown.{condition}
        condition:
          when: ["\\breward", "\\bredeem", "use up to", "wallet"]
          unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
          then: >-
            {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0).
          else: >-
            {space}A Savo Rewards box that says "no Savo Rewards" is fine. Do not apply rewards.
      consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
    - placeholder: ORDER-BAS
      description: >-
        KES Buy & Ship quote (CRM AOS_Quotes) of CUSTOMER; status Awaiting Payment, shipping S_bs,
        payable > 0, no rewards redeemed. Used by A8/C3.
      value: order_bas
      aliases: [test_quote]
      mutating: true
      area: rewards
      app: crm
      find_app: crm
      client_login_app: portal
      record_hint: the CRM record id from the page URL, the record=... part
      find: >-
        In the CRM, open Quotes (AOS_Quotes = Buy & Ship) and find one for {client} at "Awaiting Payment"
        (or "Shipping Fee Invoiced") with payable > 0 and no rewards redeemed.
      create:
        - app: crm
          text: >-
            Create a Buy & Ship quote for {client} only, with "QA-AGENT TEST" in its description, and move it to
            "Awaiting Payment" (or "Shipping Fee Invoiced"). Do not pay and do not apply rewards.
      verify:
        app: portal
        text: >-
          Log in to the portal and open Buy & Ship order {value}. It is usable if it shows a balance > 0.{condition}
        condition:
          when: ["\\breward", "\\bredeem", "use up to", "wallet"]
          unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
          then: >-
            {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0).
          else: >-
            {space}A Savo Rewards box that says "no Savo Rewards" is fine. Do not apply rewards.
      consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
    - placeholder: Wallet
      description: >-
        CUSTOMER Current rewards >= cap(S_m), and enough in KES for ORDER-KES; else run E1 first.
      value: wallet_ready
      mutating: true
      area: rewards
      app: crm
      find_app: crm
      client_login_app: portal
      min_value: 0.01
      envs: [staging, preprod, local]
      blocked_note: >-
        the case needs a rewards balance above the cap, and topping it up means paying an order, which the agent
        never does on production; top up the test client's wallet by hand and rerun
      find: >-
        Open the CRM contact of the test client {client} and read Current Rewards. If it is at least the redeem cap of
        the order in values_so_far (order_multi / order_earn / test_order; cap = 10% of unpaid shipping) plus $5, it is
        enough: record_value('wallet_ready', '<Current Rewards>'). If negative, zero or less than that: 'none'.
      create:
        - app: portal
          text: >-
            Earn rewards: take a QA-AGENT TEST shipping-only order of {client} and pay it on the portal with the
            Stripe test card from the Payments facts (staging/preprod/local, 4242). Never pay on production.
        - app: crm
          text: >-
            Move that paid order to "Order Delivered" so 5% is earned. Repeat via further orders until Current
            Rewards is enough, then record_value('wallet_ready', '<Current Rewards>').
            CRM payment alternative (only when portal card payment cannot be made): on the order DetailView open the
            Payments subpanel, Create a Paid payment for the full balance, confirm the subpanel shows the linked Paid
            payment and balance 0, then move status to Order Delivered. Note in the run that payment was made in CRM.

# Data preparation, every environment (test client only; card pay OK on staging/preprod/local;
# production never pays; M-Pesa needs an explicit phone):
# before a matching case, find a usable record or create one, then check it on the portal.
# Create is portal (customer places order) then CRM-only (parcel Received, status steps, invoice shipping).
data_prep:
  - id: shipping_only_order
    placeholder: ORDER-EARN
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["ORDER-EARN", "earn on a paid", "shipping[- ]only", "pay by card", "stripe", "abandon"]
      none: ["buy ?& ?ship", "\\bKES\\b", "shilling", "ORDER-MULTI", "multi[- ]package", "second package", "2nd package"]
    app: crm
    find_app: crm
    client_login_app: portal
    record_hint: the CRM record id from the page URL, the record=... part
    value: order_earn
    aliases: [test_order]
    mutating: true
    find: >-
      In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
      that is USD, status "Invoiced & Shipped", shipping invoiced, unpaid (balance = total, no Paid payment),
      no rewards redeemed, status not Order Delivered. Give the number with its letter prefix exactly as shown.
    create:
      - app: portal
        text: >-
          As the portal test client, create a new USD Shipping Only order (one package). Put "QA-AGENT TEST" in
          the description/notes if there is a field for it. Do not pay on the portal in this prep step.
      - app: crm
        text: >-
          For that new shipping-only order of {client}: set its parcel to Received, then move status one step at
          a time (save each): Shipped to Warehouse > On Warehouse floor > Ready to Ship > Shipped >
          Invoiced & Shipped ("Shipped" alone does not create the invoice). Invoice the shipping in the CRM.
          Do not pay and do not apply rewards.
    verify:
      app: portal
      text: >-
        Follow recipe R1: browser_navigate straight to <portal URL>/shipping-only/invoice/{record} (the
        portal invoice address uses the CRM record id; do not use View Invoice). If {record} is unknown, open
        Shipping Only orders and find order {value}. Do not click Make a Payment or Pay By Card. Wait about 4 seconds, then
        read the page: it is usable if it shows a balance > 0 and a Pay By Card button.{condition}
        If rewards from an earlier run are still applied (a pending amount with an X), click the X to remove them,
        re-read the page and judge it again; that order is still usable.
      condition:
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}This case pays without rewards (it may be the case that fills the wallet), so a Savo Rewards box
          that says "no Savo Rewards" is fine and does not make the order unusable. Do not apply rewards.
      keep_record_if:
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242", "earn"]
  - id: shipping_only_order_multi
    placeholder: ORDER-MULTI
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["ORDER-MULTI", "multi[- ]package", "second package", "2nd package", "additional parcel"]
      none: ["buy ?& ?ship", "\\bKES\\b", "shilling", "ORDER-EARN"]
    app: crm
    find_app: crm
    client_login_app: portal
    record_hint: the CRM record id from the page URL, the record=... part
    value: order_multi
    aliases: [test_order]
    mutating: true
    find: >-
      In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
      that is USD, status "Invoiced & Shipped", exactly one package, shipping invoiced, unpaid, no rewards
      redeemed/applied. Give the number with its letter prefix exactly as shown.
    create:
      - app: portal
        text: >-
          As the portal test client, create a new USD Shipping Only order with exactly one package. Put
          "QA-AGENT TEST" in the description/notes if there is a field for it. Do not pay.
      - app: crm
        text: >-
          For that new shipping-only order of {client}: set its parcel to Received, then move status one step at
          a time (save each): Shipped to Warehouse > On Warehouse floor > Ready to Ship > Shipped >
          Invoiced & Shipped. Invoice the shipping in the CRM. Leave exactly one package. Do not pay and do not
          apply rewards.
    verify:
      app: portal
      text: >-
        browser_navigate straight to <portal URL>/shipping-only/invoice/{record}. Do not click Make a Payment or
        Pay By Card. Wait about 4 seconds, then read the page: usable if balance > 0 and a Pay By Card button.{condition}
      condition:
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}A Savo Rewards box that says "no Savo Rewards" is fine. Do not apply rewards.
      keep_record_if:
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: shipping_only_order_kes
    placeholder: ORDER-KES
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["ORDER-KES", "\\bKES\\b", "shilling"]
      none: ["buy ?& ?ship"]
    app: crm
    find_app: crm
    client_login_app: portal
    record_hint: the CRM record id from the page URL, the record=... part
    value: order_kes
    aliases: [test_order]
    mutating: true
    find: >-
      In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
      that is at status "Invoiced & Shipped", in KES (Kenyan Shillings), has an invoice, nothing paid and unpaid
      shipping > 0. Give the number with its letter prefix exactly as shown.
    create:
      - app: portal
        text: >-
          As the portal test client, create a new KES (Kenyan Shillings) Shipping Only order. Put "QA-AGENT TEST"
          in the description/notes if possible. Do not pay.
      - app: crm
        text: >-
          For that KES shipping-only order of {client}: set parcel to Received; move status one step at a time to
          Invoiced & Shipped; invoice the shipping. Do not pay and do not apply rewards.
    verify:
      app: portal
      text: >-
        Follow recipe R1 step 4: browser_navigate straight to <portal URL>/shipping-only/invoice/{record} (the
        portal invoice address uses the CRM record id; do not use View Invoice). If {record} is unknown, open
        Shipping Only orders and find order {value}. Do not click Make a Payment or Pay By Card. Wait about 4 seconds, then
        read the page: it is usable if it shows a balance > 0 in KES and a Pay By Card button.{condition}
        If rewards from an earlier run are still applied (a pending amount with an X), click the X to remove them,
        re-read the page and judge it again; that order is still usable.
      condition:                     # fills {condition}: does this case use Savo Rewards?
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}This case pays without rewards (it may be the case that fills the wallet), so a Savo Rewards box
          that says "no Savo Rewards" is fine and does not make the order unusable. Do not apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: buy_ship_order
    placeholder: ORDER-BAS
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["ORDER-BAS", "buy ?& ?ship"]
    app: crm
    find_app: crm
    client_login_app: portal
    record_hint: the CRM record id from the page URL, the record=... part
    value: order_bas
    aliases: [test_quote]
    mutating: true
    find: >-
      In the CRM, open Quotes (AOS_Quotes = Buy & Ship orders) and find one for the test client {client} at status
      "Awaiting Payment" or "Shipping Fee Invoiced" with an unpaid balance > 0 (the rewards box only shows then).
    create:
      - app: crm
        text: >-
          Create a Buy & Ship order for the test client {client} only, with "QA-AGENT TEST" in its description, and move
          it to "Awaiting Payment" (or "Shipping Fee Invoiced"). Do not pay and do not apply rewards.
    verify:
      app: portal
      text: >-
        Log in to the portal and open Buy & Ship order {value}. It is usable if it shows a balance > 0.{condition}
      condition:                     # fills {condition}: does this case use Savo Rewards?
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}This case pays without rewards, so a Savo Rewards box that says "no Savo Rewards" is fine. Do not
          apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: paid_order_new_parcel
    area: rewards
    when:
      areas: [rewards]
      any: ["already paid", "new parcel", "additional parcel", "parcel (is )?added"]     # not "paid order": E1 "Earn on a paid order" pays an unpaid one
    app: crm
    value: paid_order
    find: >-
      In the CRM, find a shipping-only order (AOS_Invoices) of the test client {client} that is already paid and
      has a parcel added after the payment, so a new unpaid amount exists.
    create: >-
      Take a paid shipping-only order of the test client {client} (any order with paid >= shipping), add a new
      parcel to it marked Received with "QA-AGENT TEST" in its description, and move it on until the new amount is
      invoiced. Do not pay and do not apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: wallet_topup
    placeholder: Wallet
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["max(imum)?", "full cap", "\\bcap\\b", "more than", "exceed", "\\bWallet\\b"]
    envs: [staging, preprod, local]   # card pay OK on preprod (4242); production never pays
    blocked_note: >-
      the case needs a rewards balance above the cap, and topping it up means paying an order, which the agent
      never does on production; top up the test client's wallet by hand and rerun
    app: crm
    find_app: crm
    client_login_app: portal
    value: wallet_ready
    min_value: 0.01        # checked in code: a negative or zero wallet is never "ready"
    find: >-
      Open the CRM contact of the test client {client} and read Current Rewards. If it is at least the redeem cap of
      the order in values_so_far (order_multi / order_earn / test_order / test_quote; cap = 10% of unpaid shipping)
      plus $5, it is enough: record_value('wallet_ready', '<Current Rewards>'). If it is negative, zero or less than
      that, it is not enough: record_value('wallet_ready', 'none').
    create:
      - app: portal
        text: >-
          Earn rewards: take a QA-AGENT TEST shipping-only order of {client} and pay it on the portal with the Stripe
          test card from the Payments facts (staging/preprod/local, 4242). Portal card payment is the default when the
          case says pay on the portal. Never pay on production. M-Pesa only when the case calls for M-Pesa and a phone
          number is provided; otherwise skip (do not guess a number).
      - app: crm
        text: >-
          Move that paid order to "Order Delivered" so 5% is earned. Repeat until Current Rewards is enough, then
          record_value('wallet_ready', '<Current Rewards>'). CRM payment alternative (only when portal card payment
          cannot be made): on the order DetailView open the Payments subpanel, Create a Paid payment for the full
          balance, confirm the subpanel shows the linked Paid payment and balance 0, then move status to Order
          Delivered. Note in the run that payment was made in CRM.

# Each app's stack: testers call lookup_docs for these when a screen or workflow is unfamiliar (cached in docs/).
stack:
  crm: {name: "SuiteCRM 7", docs: ["https://docs.suitecrm.com"]}
  portal: {name: "Next.js", docs: ["https://nextjs.org/docs"]}

# Arithmetic checked in code and handed to the judge as facts (value names are matched by these patterns).
invariants:
  - name: wallet W = L - U
    values:
      W: "^w$|current_?(rewards|balance|wallet)|wallet_?balance|^current$"
      L: "^l$|total_?(rewards|earned)|lifetime"
      U: "^u$|used"
    checks: ["W == L - U", "W >= 0", "U <= L"]

# Safety rules: always injected into every LLM call; never pruned or demoted by context learning.
safety_rules:
  - text: "Stripe test card 4242 4242 4242 4242 only (staging/preprod/local). Never use a real card. Never pay on production."
    always_send: true
  - text: "M-Pesa only when the case itself calls for M-Pesa AND a phone number is provided for it; without a number, skip/BLOCKED with that reason — never guess a phone. Never M-Pesa in rewards cases unless the case explicitly requires it."
    always_send: true
  - text: "No SQL or direct DB writes except Quick Repair Execute after check_repair_sql + approval."
    always_send: true
  - text: "Restore test data afterwards (rewards rows created, wallet baseline, test orders) when the case changed them."
    always_send: true

# Numbered rules referenced from test-cases.md as "rules 2, 14" on a case — always sent while that case runs.
numbered_rules:
  1: "Rewards earn rate is 5% of shipping after rewards; earned only when status CHANGES to Order Delivered."
  2: "Redemption cap is at most 10% of unpaid shipping (not order total)."
  14: "Payments for earn: Stripe test card 4242 only (staging/preprod/local). M-Pesa only when the case calls for it with a phone; never guess."

# Deterministic (no-LLM) record lookups for CUSTOMER / data-plan find and wallet field reads.
lookups:
  platform: suitecrm7
  api: null
  maps:
    contact_by_email:
      module: Contacts
      match_field: email
      advanced: true
    shipping_orders:
      module: AOS_Invoices
      advanced: true
      field_map: {contact: billing_contact, status: status, currency: currency_id}
    quotes:
      module: AOS_Quotes
      advanced: true
      field_map: {contact: billing_contact, status: stage}
    wallet:
      module: Contacts
      fields: ["Current Rewards", "Total Rewards", "Rewards Used"]

# Cases safe to run concurrently when PARALLEL_READONLY=1 (read-only, no shared rewards session / order mutations).
# Do NOT list B2, B12, B3, B1, B16-3 etc. — they apply/clear rewards on shared order/session state.
parallel_safe_cases: [E0, B9, C1, C5, C7]
