# Savostore project pack. No secrets here: passwords are referenced by env var name only.
slug: savostore
name: Savostore
redmine:
  project_ids: [1567]
  test_case_subject_prefix: "Test Cases - "
  wiki_project: null            # null = same project as the issue
  wiki_pages: [Staging_Cardentials]

# Ask which portal/CRM user to use at the start of every run (Enter keeps the last one used).
# The usernames below are only the first suggestion on staging. Set false to always use them.
ask_accounts_each_run: true
# Environments: staging, preprod, prod, local. Missing pre-prod URLs are asked once and saved with their source.
# local = your own laptop's copy (CRM in /var/www/html/savostorea, portal = `npm run dev` in /var/www/html/savostore).

apps:
  portal:
    label: Customer portal
    envs:
      staging: https://staging5.rolustech.com:4225/
      preprod: https://westeros.rolustech.com:44310/   # Redmine wiki Pre_Prod_Cardentials
      prod: https://app.savostore.com/
      local: http://localhost:3000/          # Next.js dev server of /var/www/html/savostore
    accounts:
      customer:
        username: sidney@savostore.com
        password_env: SAVO_STAGING_PORTAL_PASSWORD
  crm:
    label: CRM (SuiteCRM)
    envs:
      staging: https://staging5.rolustech.com:4220/
      preprod: https://staging5.rolustech.com:44360/   # Redmine wiki Pre_Prod_Cardentials
      prod: https://savo.store/
      local: http://localhost/savostorea/    # SuiteCRM in /var/www/html/savostorea (portal's SUITECRM_INSTANCE_URL)
    accounts:
      admin:
        username: admin              # staging Administrator; maria.tariq is not an admin and cannot do data prep
        password_env: SAVOSTORE_CRM_PASSWORD__ADMIN
        role_markers: ["Admin"]      # text that must be visible after login for the admin role
    settle_seconds: 10               # subpanels and wallet totals load ~8 s late

# Apps whose login shows a CAPTCHA: a person logs in once in a visible browser before the cases run.
manual_login_apps: [portal]

# Known sites: pack URLs on these hosts don't need confirming at the plan gate. The browser itself is limited
# to the sites of each run's URLs, and asks before using any other site (e.g. a payment page).
allowlist:
  staging: [staging5.rolustech.com, checkout.stripe.com]
  preprod: [westeros.rolustech.com, staging5.rolustech.com, checkout.stripe.com]
  prod: [app.savostore.com, savo.store]
  local: [localhost, checkout.stripe.com]

# Action types the user may pre-approve for a whole run at the plan gate.
# change_settings is staging/preprod only (Policy.can_preapprove blocks it on prod).
preapprovable_actions:
  - pay_staging_test_card
  - move_order_status
  - create_test_order
  - add_parcel
  - change_settings
  - execute_repair_sql      # Quick Repair SQL that only adds new columns/tables/indexes (staging/preprod)

# Never pre-approvable: always a one-off approval.
always_ask_actions:
  - redmine_post
  - send_email
  - prod_write
  - repair_sql_destructive  # Quick Repair SQL that drops, changes or rewrites anything

risky_patterns:
  - "(?i)\\bpay( now)?\\b"
  - "(?i)\\bplace order\\b"
  - "(?i)\\bsubmit\\b"
  - "(?i)\\bconfirm\\b"
  - "(?i)\\bdelete\\b"
  - "(?i)checkout\\.stripe\\.com"

memory_areas: [rewards, protection, parcels, orders, payments, ui]

# Helpers (phase 6). Core helpers login_form and read_table need no setup. Project helpers stay disabled
# until their path and labels are confirmed on the real UI (fill these from a live run, never guessed).
helpers:
  login_form: {}                  # optional: path, user_label, password_label, submit_label
  read_wallet:
    path: null                    # portal page that shows the rewards wallet
    labels: []                    # e.g. the exact labels next to the Current / Total / Used amounts
  portal_apply_rewards: {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  portal_create_order:  {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  crm_move_order_status: {path: null, selects: {}, submit_label: null, success_text: null, read_labels: []}
  crm_add_parcel:       {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}
  crm_ship_parcel:      {path: null, fields: {}, submit_label: null, success_text: null, read_labels: []}

# Data preparation, every environment (test client only; payments on production are always skipped):
# before a matching case, find a usable record or create one, then check it on the portal.
data_prep:
  - id: shipping_only_order
    area: rewards
    when:
      areas: [rewards, portal]        # portal-area cases (B1, B3, B12, B15, B16) open an invoice too
      any: ["shipping[- ]only", "pay by card", "stripe", "abandon", "invoice", "order-[a-z]+"]
      none: ["buy ?& ?ship"]
    app: crm
    client_login_app: portal          # the portal login picked at the start identifies the test client
    record_hint: the CRM record id from the page URL, the record=... part
    value: test_order
    test_client:          # optional CRM name per env; otherwise the client is matched by the portal user picked at the start
      staging: Hammad Iqbal
    find: >-
      In the CRM, open Invoices (AOS_Invoices = shipping-only orders) and find one for the test client {client}
      (portal user "Hammad"; match by the orders the client owns, not by the name "Sidney Test") that is at
      status "Invoiced & Shipped", has an invoice, nothing paid and unpaid shipping > 0. Give the number with its letter prefix, e.g. A1142. An order with rewards
      still pending from an earlier run is still a fit (the check clears them).
    create: >-
      Create a shipping-only order for the test client {client} only, with "QA-AGENT TEST" in its description,
      set its parcel to Received, then move the status one step at a time: Shipped to Warehouse > On Warehouse
      floor > Ready to Ship > Shipped > Invoiced & Shipped ("Shipped" alone does not create the invoice).
      Do not pay and do not apply rewards.
    verify:
      app: portal
      text: >-
        Follow recipe R1 step 4: browser_navigate straight to <portal URL>/shipping-only/invoice/{record} (the
        portal invoice address uses the CRM record id; do not use View Invoice). If {record} is unknown, open
        Shipping Only orders and find order {value}. Do not click Make a Payment or Pay By Card. Wait about 4 seconds, then
        read the page: it is usable if it shows a balance > 0 and a Pay By Card button.{condition}
        If rewards from an earlier run are still applied (a pending amount with an X), click the X to remove them,
        re-read the page and judge it again; that order is still usable.
      condition:                     # fills {condition}: does this case use Savo Rewards?
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}This case pays without rewards (it may be the case that fills the wallet), so a Savo Rewards box
          that says "no Savo Rewards" is fine and does not make the order unusable. Do not apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: buy_ship_order
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["buy ?& ?ship"]
    app: crm
    client_login_app: portal
    record_hint: the CRM record id from the page URL, the record=... part
    value: test_quote
    find: >-
      In the CRM, open Quotes (AOS_Quotes = Buy & Ship orders) and find one for the test client {client} at status
      "Awaiting Payment" or "Shipping Fee Invoiced" with an unpaid balance > 0 (the rewards box only shows then).
    create: >-
      Create a Buy & Ship order for the test client {client} only, with "QA-AGENT TEST" in its description, and move
      it to "Awaiting Payment" (or "Shipping Fee Invoiced"). Do not pay and do not apply rewards.
    verify:
      app: portal
      text: >-
        Log in to the portal and open Buy & Ship order {value}. It is usable if it shows a balance > 0.{condition}
      condition:                     # fills {condition}: does this case use Savo Rewards?
        when: ["\\breward", "\\bredeem", "use up to", "wallet"]
        unless: ["without (any |the |savo )*rewards", "no (savo )?rewards (applied|used)", "(do not|don't|not) (apply|use) (any |savo )*rewards"]
        then: >-
          {space}It must also show the Savo Rewards box with "You can use up to $X" (X > 0). Reload once if the box
          says "no Savo Rewards".
        else: >-
          {space}This case pays without rewards, so a Savo Rewards box that says "no Savo Rewards" is fine. Do not
          apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: paid_order_new_parcel
    area: rewards
    when:
      areas: [rewards]
      any: ["already paid", "new parcel", "additional parcel", "parcel (is )?added"]     # not "paid order": E1 "Earn on a paid order" pays an unpaid one
    app: crm
    value: paid_order
    find: >-
      In the CRM, find a shipping-only order (AOS_Invoices) of the test client {client} that is already paid and
      has a parcel added after the payment, so a new unpaid amount exists.
    create: >-
      Take a paid shipping-only order of the test client {client} (any order with paid >= shipping), add a new
      parcel to it marked Received with "QA-AGENT TEST" in its description, and move it on until the new amount is
      invoiced. Do not pay and do not apply rewards.
      keep_record_if:                # order is fine but the wallet is empty: keep the order, block the case
        reason: "no savo rewards|rewards box|use up to|wallet|no rewards"
        only_when_condition: true
        note: the client's Savo Rewards wallet is empty or negative (top it up with the earn case first)
    consumed_by: ["complete payment", "pay with", "\\bpays?\\b", "4242"]
  - id: wallet_topup
    area: rewards
    when:
      areas: [rewards, portal]
      any: ["max(imum)?", "full cap", "\\bcap\\b", "more than", "exceed"]
    envs: [staging, local]          # earning needs a payment, which never happens on pre-prod/production
    blocked_note: >-
      the case needs a rewards balance above the cap, and topping it up means paying an order, which the agent
      never does on pre-prod or production; top up the test client's wallet by hand and rerun
    app: crm
    value: wallet_ready
    min_value: 0.01        # checked in code: a negative or zero wallet is never "ready"
    find: >-
      Open the CRM contact of the test client {client} and read Current Rewards. If it is at least the redeem cap of
      the order in values_so_far (test_order / test_quote; cap = 10% of unpaid shipping) plus $5, it is enough:
      record_value('wallet_ready', '<Current Rewards>'). If it is negative, zero or less than that, it is not
      enough: record_value('wallet_ready', 'none').
    create: >-
      Earn rewards: take a QA-AGENT TEST shipping-only order of {client}, pay it on the portal with the Stripe test
      card from the Payments facts (staging only), then move it to "Order Delivered" in the CRM so 5% is earned.
      Repeat until Current Rewards is enough, then record_value('wallet_ready', '<Current Rewards>').

# Each app's stack: testers call lookup_docs for these when a screen or workflow is unfamiliar (cached in docs/).
stack:
  crm: {name: "SuiteCRM 7", docs: ["https://docs.suitecrm.com"]}
  portal: {name: "Next.js", docs: ["https://nextjs.org/docs"]}

# Arithmetic checked in code and handed to the judge as facts (value names are matched by these patterns).
invariants:
  - name: wallet W = L - U
    values:
      W: "^w$|current_?(rewards|balance|wallet)|wallet_?balance|^current$"
      L: "^l$|total_?(rewards|earned)|lifetime"
      U: "^u$|used"
    checks: ["W == L - U", "W >= 0", "U <= L"]
